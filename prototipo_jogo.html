<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piggy Beach Adventure — React Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=VT323&family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
/* ═══════════════════════════════════════════════
   PIGGY BEACH ADVENTURE — ARCADE PREMIUM
   Aesthetic: Coastal Retro / No Emojis (Exceto o Cursor!)
═══════════════════════════════════════════════ */
:root {
  --cyan:       #00f5d4;
  --cyan-dim:   #00c4a8;
  --cyan-glow:  rgba(0,245,212,0.18);
  --gold:       #ffd166;
  --gold-dim:   #c89c3c;
  --gold-glow:  rgba(255,209,102,0.2);
  --red:        #ef476f;
  --red-dim:    #b02040;
  --red-glow:   rgba(239,71,111,0.2);
  --sand:       #f4a261;
  --sky:        #118ab2;
  --ocean:      #06d6a0;
  --bg-deep:    #040810;
  --bg-dark:    #070c18;
  --bg-mid:     #0b1224;
  --bg-card:    rgba(255,255,255,0.034);
  --bg-card-h:  rgba(255,255,255,0.065);
  --border:     rgba(255,255,255,0.07);
  --border-h:   rgba(0,245,212,0.35);
  --white:      #f0f4ff;
  --muted:      rgba(240,244,255,0.42);
  --muted2:     rgba(240,244,255,0.22);

  --font-head: 'Bebas Neue', sans-serif;
  --font-pixel: 'VT323', monospace;
  --font-ui:    'Outfit', sans-serif;
  --font-body:  'Space Grotesk', sans-serif;
  --r: 10px;
  --r-lg: 18px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

/* ── CURSOR CUSTOMIZADO (PORQUINHO E MAÇÃ) ── */
html, body {
  cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><text y='24' font-size='24'>🐷</text></svg>"), auto !important;
}
html:active, body:active {
  cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><text y='24' font-size='24'>🍎</text></svg>"), auto !important;
}
a, button, .nav-cta, .btn-primary, .btn-secondary, .btn-cta-main, .gcard, .item-card, .world-card, .char-card {
  cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><text y='24' font-size='24'>🐷</text></svg>"), pointer !important;
}
a:active, button:active, .nav-cta:active, .btn-primary:active, .btn-secondary:active, .btn-cta-main:active, .gcard:active, .item-card:active, .world-card:active, .char-card:active {
  cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><text y='24' font-size='24'>🍎</text></svg>"), pointer !important;
}

body {
  font-family: var(--font-body); background: var(--bg-deep); color: var(--white);
  overflow-x: hidden;
}

/* NOISE GRAIN & SCANLINES */
body::before {
  content: ''; position: fixed; inset: 0; z-index: 9000; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.028; mix-blend-mode: overlay;
}
body::after {
  content: ''; position: fixed; inset: 0; z-index: 9001; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
}

/* NAV */
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 800; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: rgba(4,8,16,0.7); backdrop-filter: blur(20px) saturate(180%); border-bottom: 1px solid var(--border); }
nav::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--cyan), transparent); opacity: 0.5; }
.nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; font-family: var(--font-head); font-size: 22px; letter-spacing: 3px; color: var(--white); }
.nav-logo-mark { width: 14px; height: 14px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 12px var(--cyan); animation: pulseLogo 2s infinite alternate; }
@keyframes pulseLogo { from { transform: scale(1); } to { transform: scale(1.2); } }
.nav-logo span { color: var(--cyan); }
.nav-links { display: flex; gap: 2px; list-style: none; }
.nav-links a { font-family: var(--font-ui); font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 8px 16px; border-radius: 6px; transition: color 0.2s, background 0.2s; }
.nav-links a:hover { color: var(--cyan); background: var(--cyan-glow); }
.nav-cta { font-family: var(--font-ui); font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--bg-deep); background: var(--cyan); text-decoration: none; padding: 9px 22px; border-radius: 6px; transition: background 0.2s, box-shadow 0.2s, transform 0.1s; box-shadow: 0 0 20px rgba(0,245,212,0.35); }
.nav-cta:hover { background: #fff; box-shadow: 0 0 32px rgba(0,245,212,0.6); transform: translateY(-1px); }

/* HERO - DAY/NIGHT CYCLE */
.hero { margin-top: 64px; position: relative; height: calc(100vh - 64px); min-height: 700px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.hero-sky-container { position: absolute; inset: 0; background-color: #030914; animation: skyCycle 40s linear infinite; }
.sky-gradient-night { position: absolute; inset: 0; background: linear-gradient(180deg, #030914 0%, #061428 18%, #082240 35%, #0a3050 50%, #0d4868 60%, #106080 68%, #148898 74%, #06d6a0 85%, #05c090 90%, #c4883a 94%, #d4983a 97%, #c07428 100%); animation: nightCycle 40s linear infinite; }
.sky-gradient-day { position: absolute; inset: 0; background: linear-gradient(180deg, #4aa4d8 0%, #7ecce8 35%, #c8e0f0 60%, #e8d8a0 74%, #f4a261 85%, #e8a855 100%); animation: dayCycle 40s linear infinite; }
@keyframes nightCycle { 0%, 15%, 85%, 100% { opacity: 1; } 35%, 65% { opacity: 0; } }
@keyframes dayCycle { 0%, 15%, 85%, 100% { opacity: 0; } 35%, 65% { opacity: 1; } }

.stars { position: absolute; inset: 0; animation: starFade 40s linear infinite; }
.star { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; animation: twinkle var(--d) ease-in-out infinite alternate; }
@keyframes twinkle { from{opacity:0.1} to{opacity:0.9} }
@keyframes starFade { 0%, 15%, 85%, 100% { opacity: 1; } 35%, 65% { opacity: 0; } }

.clouds-container { position: absolute; inset: 0; animation: dayCycle 40s linear infinite; pointer-events: none; }
.cloud { position: absolute; background: white; border-radius: 4px; box-shadow: 10px 0 0 white, -10px 0 0 white, 0 10px 0 white, 20px 0 0 white, -20px 0 0 rgba(255,255,255,0.5); opacity: 0.8; }
.cloud::before { content: ''; position: absolute; background: white; border-radius: 4px; width: 60%; height: 140%; top: -50%; left: 20%; box-shadow: 10px 0 0 white; }
.c1 { width:120px; height:30px; top:15%; left:-20%; animation: drift 40s linear infinite; }
.c2 { width:80px; height:20px; top:30%; left:-10%; animation: drift 30s linear infinite 5s; }
.c3 { width:140px; height:35px; top:10%; left:-30%; animation: drift 50s linear infinite 15s; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(120vw); } }

.hero-horizon { position: absolute; bottom: 32%; left: 0; right: 0; height: 120px; background: radial-gradient(ellipse 80% 100% at 50% 100%, rgba(0,245,212,0.22), transparent); pointer-events: none; animation: nightCycle 40s linear infinite; }

.celestial-orbit { position: absolute; bottom: 20%; left: 50%; width: 1px; height: 1px; animation: orbit 40s linear infinite; }
@keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.hero-sun { position: absolute; width: 80px; height: 80px; top: -350px; left: -40px; background: radial-gradient(circle, #fff8e0 0%, #ffd166 40%, #f4a261 70%, transparent 100%); border-radius: 50%; box-shadow: 0 0 40px 20px rgba(255,209,102,0.4), 0 0 100px 40px rgba(255,209,102,0.15); animation: counterOrbit 40s linear infinite, sunPulse 4s ease-in-out infinite; }
.hero-moon { position: absolute; width: 60px; height: 60px; bottom: -350px; left: -30px; background: radial-gradient(circle, #ffffff 0%, #d0e0f0 40%, transparent 80%); border-radius: 50%; box-shadow: 0 0 30px 10px rgba(255,255,255,0.3), 0 0 60px 20px rgba(255,255,255,0.1); animation: counterOrbit 40s linear infinite; }
.hero-moon::before { content: ''; position: absolute; width: 12px; height: 12px; background: rgba(0,0,0,0.1); border-radius: 50%; top: 15px; left: 15px; box-shadow: 20px 10px 0 2px rgba(0,0,0,0.08), 5px 25px 0 -2px rgba(0,0,0,0.12); }
@keyframes counterOrbit { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

/* Ocean */
.hero-ocean { position: absolute; bottom: 20%; left: 0; right: 0; height: 200px; background: linear-gradient(180deg, var(--ocean) 0%, #04a878 50%, #028058 100%); overflow: hidden; animation: oceanCycle 40s linear infinite; }
@keyframes oceanCycle { 0%, 15%, 85%, 100% { filter: brightness(1); } 35%, 65% { filter: brightness(1.3) saturate(1.2); } }
.wave { position: absolute; top: 0; left: -100%; width: 300%; height: 30px; }
.wave svg { width: 100%; height: 100%; }
.wave1 { animation: waveMove 6s linear infinite; }
.wave2 { animation: waveMove 9s linear infinite reverse; top: 12px; opacity: 0.5; }
.wave3 { animation: waveMove 12s linear infinite; top: 20px; opacity: 0.3; }
@keyframes waveMove { from{transform:translateX(0)} to{transform:translateX(33.33%)} }
.ocean-shimmer { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0px, transparent 40px, rgba(255,255,255,0.07) 80px, transparent 120px); animation: shimmer 3s linear infinite; }
@keyframes shimmer { from{transform:translateX(-120px)} to{transform:translateX(0)} }

/* Sand */
.hero-sand { position: absolute; bottom: 0; left: 0; right: 0; height: 20%; background: linear-gradient(180deg, #e8a855 0%, #c27c20 100%); animation: sandCycle 40s linear infinite; }
@keyframes sandCycle { 0%, 15%, 85%, 100% { filter: brightness(1); } 35%, 65% { filter: brightness(1.2) saturate(1.1); } }
.hero-sand::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: repeating-linear-gradient(90deg, #d49840 0 24px, #c08030 24px 32px, #e0aa50 32px 48px); }
.hero-sand::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(175deg, transparent 0px, transparent 12px, rgba(0,0,0,0.06) 12px, rgba(0,0,0,0.06) 13px, transparent 13px, transparent 26px); }

/* Platforms */
.plat { position: absolute; height: 20px; background: linear-gradient(180deg, #e8b870 0%, #c08838 100%); border-radius: 3px; box-shadow: 0 4px 0 #8a5820, 0 8px 0 rgba(0,0,0,0.3), inset 0 2px 0 rgba(255,255,255,0.2); animation: platCycle 40s linear infinite; }
@keyframes platCycle { 0%, 15%, 85%, 100% { filter: brightness(1); } 35%, 65% { filter: brightness(1.2); } }
.plat::after { content: ''; position: absolute; top: -8px; left: 0; right: 0; height: 8px; background: linear-gradient(180deg, #d4a058 0%, #c08838 100%); border-radius: 3px 3px 0 0; box-shadow: 0 -2px 0 rgba(255,255,255,0.15); }
.plat1 { bottom: calc(20% + 90px); left: 6%; width: 200px; }
.plat2 { bottom: calc(20% + 180px); left: 30%; width: 180px; animation: platFloat 3.5s ease-in-out infinite, platCycle 40s linear infinite; }
.plat3 { bottom: calc(20% + 140px); left: 58%; width: 150px; animation: platFloat 2.8s ease-in-out infinite 1s, platCycle 40s linear infinite; }
.plat4 { bottom: calc(20% + 230px); right: 6%; width: 120px; animation: platFloat 4s ease-in-out infinite 0.5s, platCycle 40s linear infinite; }
@keyframes platFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

/* Fireflies */
.fireflies { position: absolute; inset: 0; pointer-events: none; animation: nightCycle 40s linear infinite; }
.firefly { position: absolute; width: 4px; height: 4px; background: #cfff04; border-radius: 50%; box-shadow: 0 0 8px 2px #cfff04; animation: fireflyMove 8s ease-in-out infinite alternate, twinkle 2s ease-in-out infinite alternate; }
.f1 { bottom: 25%; left: 15%; animation-delay: 0s, 1s; }
.f2 { bottom: 35%; right: 25%; animation-delay: 2s, 0.5s; }
.f3 { bottom: 15%; left: 55%; animation-delay: 4s, 1.5s; }
@keyframes fireflyMove { 0% { transform: translate(0, 0); } 50% { transform: translate(20px, -15px); } 100% { transform: translate(-15px, -30px); } }

/* CSS Characters */
.piggy { position: absolute; bottom: calc(20% + 110px); left: calc(6% + 60px); animation: piggyIdle 0.6s steps(2) infinite, charCycle 40s linear infinite; }
@keyframes piggyIdle { from{transform:translateY(0)} to{transform:translateY(-6px)} }
@keyframes charCycle { 0%, 15%, 85%, 100% { filter: brightness(0.8); } 35%, 65% { filter: brightness(1.1); } }
.piggy-sprite { width: 40px; height: 48px; position: relative; image-rendering: pixelated; }
.p-head { position: absolute; width: 36px; height: 28px; top: 0; left: 2px; background: #f0a888; border-radius: 6px 6px 2px 2px; box-shadow: inset -4px -4px 0 #d08060; }
.p-head::before { content: ''; position: absolute; width: 10px; height: 10px; background: #f0a888; top: -6px; left: 4px; border-radius: 3px; box-shadow: 16px 0 0 #f0a888; }
.p-eye { position: absolute; width: 6px; height: 7px; background: #1a0800; top: 9px; left: 6px; border-radius: 2px; }
.p-eye::after { content: ''; position: absolute; width: 2px; height: 2px; background: white; top: 1px; left: 1px; border-radius: 50%; }
.p-eye2 { left: 22px; }
.p-snout { position: absolute; width: 16px; height: 11px; background: #e08878; bottom: 5px; left: 10px; border-radius: 4px; box-shadow: inset 0 2px 0 rgba(0,0,0,0.1); }
.p-snout::before, .p-snout::after { content: ''; position: absolute; width: 4px; height: 4px; background: #b04030; border-radius: 50%; top: 3px; }
.p-snout::before { left: 3px; } .p-snout::after { right: 3px; }
.p-body { position: absolute; width: 32px; height: 22px; bottom: 0; left: 4px; background: #f0a888; border-radius: 0 0 3px 3px; box-shadow: inset -4px -3px 0 #d08060; }
.p-belt { position: absolute; width: 32px; height: 6px; bottom: 14px; left: 4px; background: #5070a0; box-shadow: 0 1px 0 #304870, 0 -1px 0 rgba(255,255,255,0.15); }
.p-legs { position: absolute; width: 10px; height: 8px; bottom: -8px; left: 8px; background: #d08060; border-radius: 0 0 4px 4px; box-shadow: 12px 0 0 #d08060; }

.enemy-goblin { position: absolute; bottom: calc(20% + 6px); right: 16%; animation: goblinWalk 0.5s steps(2) infinite, charCycle 40s linear infinite; }
@keyframes goblinWalk { from{transform:scaleX(1)} to{transform:scaleX(-1)} }
.g-sprite { width: 44px; height: 56px; position: relative; }
.g-head { position: absolute; width: 40px; height: 32px; top: 0; left: 2px; background: #7a6040; border-radius: 4px; box-shadow: inset -4px -4px 0 #5a4020; }
.g-eyes { position: absolute; width: 7px; height: 7px; background: #100800; top: 11px; left: 8px; border-radius: 1px; box-shadow: 16px 0 0 #100800; }
.g-teeth { position: absolute; width: 6px; height: 4px; background: white; bottom: 6px; left: 14px; border-radius: 1px; box-shadow: 8px 0 0 white; }
.g-body { position: absolute; width: 40px; height: 26px; bottom: 0; left: 2px; background: #902820; border-radius: 2px; box-shadow: inset -3px -4px 0 #6a1010; }
.g-legs { position: absolute; bottom: -8px; left: 8px; width: 10px; height: 8px; background: #5a3818; border-radius: 0 0 3px 3px; box-shadow: 14px 0 0 #5a3818; }

/* CSS Collectibles */
.coin-float { position: absolute; width: 18px; height: 18px; background: radial-gradient(circle at 35% 35%, #ffe080, var(--gold), #c89030); border-radius: 50%; box-shadow: 0 0 10px rgba(255,209,102,0.8), inset -2px -2px 0 rgba(0,0,0,0.2); animation: coinBob 1.2s ease-in-out infinite alternate, coinGlow 2s ease-in-out infinite; }
@keyframes coinBob { from{transform:translateY(0) rotateY(0deg)} to{transform:translateY(-10px) rotateY(180deg)} }
@keyframes coinGlow { 0%,100%{box-shadow:0 0 10px rgba(255,209,102,0.8)} 50%{box-shadow:0 0 20px rgba(255,209,102,1), 0 0 40px rgba(255,209,102,0.4)} }
.coins-arc { position: absolute; bottom: calc(20% + 290px); left: 33%; display: flex; gap: 8px; }
.hero-item { position: absolute; animation: itemFloat 2s ease-in-out infinite alternate; }
.hi-berry { width: 20px; height: 20px; background: var(--red); border-radius: 50% 50% 10px 10px; bottom: calc(20% + 220px); right: 23%; box-shadow: inset 4px 4px 0 #ff7090, 0 0 12px var(--red-glow); }
.hi-potion { width: 16px; height: 22px; background: var(--cyan); border-radius: 10px 10px 4px 4px; bottom: calc(20% + 16px); left: 44%; box-shadow: inset -4px -4px 0 var(--cyan-dim), 0 0 12px var(--cyan-glow); }
.hi-chest { width: 24px; height: 18px; background: var(--gold-dim); border-radius: 4px; bottom: calc(20% + 200px); right: 8%; box-shadow: inset 2px 2px 0 #e0a850, 0 0 12px var(--gold-glow); }
@keyframes itemFloat { from{transform:translateY(0)} to{transform:translateY(-12px)} }

/* HUD Elements */
.hero-hud { position: absolute; top: 24px; left: 32px; display: flex; flex-direction: column; gap: 8px; font-family: var(--font-pixel); z-index: 100;}
.hud-score { font-size: 24px; color: var(--gold); text-shadow: 2px 2px 0 rgba(0,0,0,0.5); letter-spacing: 2px; }
.hud-lives { font-size: 20px; color: var(--red); text-shadow: 2px 2px 0 rgba(0,0,0,0.5); letter-spacing: 2px; }
.hud-bar-wrap { display: flex; align-items: center; gap: 8px; }
.hud-bar-label { font-size: 16px; color: var(--cyan); }
.hud-bar { width: 120px; height: 10px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); border-radius: 2px; overflow: hidden; }
.hud-bar-fill { height: 100%; background: linear-gradient(90deg, #00f5d4, #06d6a0); box-shadow: 0 0 8px rgba(0,245,212,0.6); width: 70%; border-radius: 2px; transition: width 0.3s; }

/* Hero Center Card */
.hero-content { position: relative; z-index: 20; text-align: center; }
.hero-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-ui); font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--cyan); background: rgba(0,245,212,0.1); border: 1px solid rgba(0,245,212,0.3); padding: 6px 16px; border-radius: 100px; margin-bottom: 28px; backdrop-filter: blur(10px); }
.eyebrow-dot { width: 6px; height: 6px; background: var(--cyan); border-radius: 50%; animation: dotPulse 1.5s ease-in-out infinite; }
@keyframes dotPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.3;transform:scale(0.6)} }

.hero-title { font-family: var(--font-head); font-size: clamp(64px, 10vw, 130px); line-height: 0.88; letter-spacing: 4px; color: var(--white); text-shadow: 0 0 80px rgba(0,245,212,0.3), 0 4px 0 rgba(0,0,0,0.5); margin-bottom: 10px; }
.hero-title .title-accent { color: var(--cyan); }
.hero-title .title-beach { color: var(--gold); }
.hero-sub { font-family: var(--font-pixel); font-size: 22px; color: var(--muted); letter-spacing: 4px; margin-bottom: 40px; text-shadow: 0 0 20px rgba(0,245,212,0.3); }

.hero-btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 44px; }
.btn-primary { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-ui); font-size: 14px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--bg-deep); background: var(--cyan); text-decoration: none; padding: 16px 36px; border-radius: 8px; border: none; box-shadow: 0 0 30px rgba(0,245,212,0.4), 0 4px 20px rgba(0,0,0,0.4); transition: all 0.2s; position: relative; overflow: hidden; }
.btn-primary::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: left 0.4s; }
.btn-primary:hover::before { left: 100%; }
.btn-primary:hover { background: #fff; box-shadow: 0 0 50px rgba(0,245,212,0.7), 0 4px 30px rgba(0,0,0,0.4); transform: translateY(-2px); }
.btn-secondary { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-ui); font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--white); background: transparent; text-decoration: none; padding: 15px 32px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px); transition: all 0.2s; }
.btn-secondary:hover { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 20px rgba(255,209,102,0.2); transform: translateY(-2px); }

.hero-meta { display: flex; align-items: center; justify-content: center; gap: 24px; font-family: var(--font-ui); font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted2); }
.hero-meta-dot { width: 3px; height: 3px; background: var(--muted2); border-radius: 50%; }
.blink { animation: blink 1s steps(1) infinite; }

<script type="text/babel">
  const { useState, useEffect } = React;

                          <div style={{ height: '120px', background: f.bg, display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative' }}>
                            {f.boss && <span style={{ position: 'absolute', top: '10px', right: '10px', fontFamily: 'var(--font-ui)', fontSize: '10px', fontWeight: 800, letterSpacing: '2px', textTransform: 'uppercase', color: '#fff', background: 'var(--red)', padding: '4px 10px', borderRadius: '4px' }}>BOSS</span>}
                            <span style={{ fontFamily: 'var(--font-pixel)', fontSize: '28px', color: 'rgba(255,255,255,0.85)', background: 'rgba(0,0,0,0.35)', padding: '3px 12px', borderRadius: '5px' }}>{f.n}</span>
                          </div>
                          <div style={{ padding: '18px 20px 22px' }}>
                            <h4 style={{ fontFamily: 'var(--font-head)', fontSize: '18px', letterSpacing: '2px', color: 'var(--white)', marginBottom: '8px' }}>{f.name}</h4>
                            <p style={{ fontSize: '13px', color: 'var(--muted)', lineHeight: 1.75 }}>{f.desc}</p>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ) : (
                  <div style={{ background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 'var(--r-lg)', padding: '48px', textAlign: 'center' }}>
                    <div style={{ fontFamily: 'var(--font-head)', fontSize: '60px', color: 'rgba(239,71,111,0.2)', marginBottom: '14px' }}>?</div>
                    <div style={{ fontFamily: 'var(--font-pixel)', fontSize: '22px', color: 'var(--red)', letterSpacing: '2px', marginBottom: '10px' }}>MUNDO BLOQUEADO</div>
                    <p style={{ fontSize: '14px', color: 'var(--muted2)' }}>Complete os mundos da Praia e da Selva para desbloquear.</p>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </section>
    );
  };

  /* ═══════════════════════════════════════════════
     NOVA SESSÃO: INTEGRANTES DO GRUPO

          <div className="char-card reveal reveal-delay-1">
            <div className="char-avatar" style={{ fontSize: '38px', color: 'var(--cyan)' }}>2</div>
            <h3 className="char-name">Nome do Aluno 2</h3>

          <div className="char-card reveal reveal-delay-2">

  const App = () => {
    useEffect(() => {
      const els = document.querySelectorAll('.reveal');
      const io = new IntersectionObserver((entries, obs) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add('in');
            obs.unobserve(e.target);
          }
        });
      }, { threshold: 0.12 });
      els.forEach(el => io.observe(el));
      
      return () => io.disconnect();
    }, []);

    return (
      <React.Fragment>
        <Navbar />
        <Hero />
        <Ticker />
        <Sobre />
        <Processo />

        <WorldMap />

        <Equipe />
        <CTA />
        <Footer />

    );
  };

  const rootElement = document.getElementById('root');
  const root = ReactDOM.createRoot(rootElement);
  root.render(<App />);
