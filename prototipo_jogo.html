<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piggy Beach Adventure — A Maldição da Maré</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Josefin+Sans:wght@300;400;600;700&family=Special+Elite&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --azul: #1a3a6b; --azul-med: #2252a0; --azul-claro: #4a80c8;
            --azul-pale: rgba(26,58,107,0.08);
            --branco: #f4efe6; --creme: #ede5d4; --palha: #d4c090;
            --laranja: #e06820; --laranja-q: #c84808;
            --laranja-pale: rgba(224,104,32,0.1);
            --verde: #2a7a40; --verde-pale: rgba(42,122,64,0.1);
            --ocre: #c89030; --ocre-pale: rgba(200,144,48,0.12);
            --tinta: #0e1520; --tinta-soft: #172030; --tinta-mid: #1e2c40;
            --muted: rgba(14,21,32,0.5); --muted-lite: rgba(14,21,32,0.3);
            --borda: rgba(14,21,32,0.12); --borda-mid: rgba(14,21,32,0.2);
            --tile-size: 40px;
            --f-display: 'Playfair Display', serif;
            --f-ui: 'Josefin Sans', sans-serif;
            --f-cordel: 'Special Elite', serif;
            --f-mono: 'DM Mono', monospace;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
        body{font-family:var(--f-display);background:var(--creme);color:var(--tinta);overflow-x:hidden}
        html,body{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28'><text y='22' font-size='22'>🐷</text></svg>"),auto!important}
        html:active,body:active{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28'><text y='22' font-size='22'>🍎</text></svg>"),auto!important}
        a,button{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28'><text y='22' font-size='22'>🐷</text></svg>"),pointer!important}
        body::before{content:'';position:fixed;inset:0;z-index:9000;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:0.025;mix-blend-mode:multiply}
        body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(45deg,rgba(26,58,107,.025) 25%,transparent 25%),linear-gradient(-45deg,rgba(26,58,107,.025) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(26,58,107,.025) 75%),linear-gradient(-45deg,transparent 75%,rgba(26,58,107,.025) 75%);background-size:var(--tile-size) var(--tile-size);background-position:0 0,0 20px,20px -20px,-20px 0}
        nav{position:fixed;top:0;left:0;right:0;z-index:800;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;background:rgba(237,229,212,.9);backdrop-filter:blur(14px) saturate(180%);border-bottom:2px solid var(--azul)}
        nav::after{content:'';position:absolute;bottom:-5px;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,var(--laranja) 0 8px,var(--azul) 8px 16px,var(--ocre) 16px 24px,var(--azul) 24px 32px);opacity:.6}
        .nav-logo{font-family:var(--f-cordel);font-size:18px;color:var(--azul);text-decoration:none;display:flex;align-items:center;gap:12px;letter-spacing:.04em}
        .nav-losango{width:12px;height:12px;background:var(--laranja);transform:rotate(45deg);animation:losangoPulse 2s ease-in-out infinite alternate}
        @keyframes losangoPulse{from{transform:rotate(45deg) scale(1)}to{transform:rotate(45deg) scale(1.25)}}
        .nav-links{display:flex;gap:0;list-style:none}
        .nav-links a{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:7px 16px;transition:color .2s}
        .nav-links a:hover{color:var(--azul)}
        .nav-cta{font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--branco);background:var(--azul);text-decoration:none;padding:8px 22px;border-radius:2px;border:2px solid var(--azul);transition:background .2s,color .2s,transform .15s}
        .nav-cta:hover{background:var(--laranja);border-color:var(--laranja);transform:translateY(-1px)}
        .hero{margin-top:58px;min-height:calc(100vh - 58px);position:relative;overflow:hidden;display:flex;flex-direction:column;background:#0d1828}
        .hero-sky{position:absolute;inset:0;animation:ceuCiclo 52s linear infinite}
        @keyframes ceuCiclo{0%{background:linear-gradient(180deg,#04080e 0%,#0a1020 100%)}20%{background:linear-gradient(180deg,#0c1830 0%,#1a3050 100%)}35%{background:linear-gradient(180deg,#d04020 0%,#e06828 40%,#f0a840 70%,#e8c870 100%)}45%{background:linear-gradient(180deg,#3888c8 0%,#78b8e8 40%,#b8d8f0 65%,#e8c878 80%,#e09040 100%)}58%{background:linear-gradient(180deg,#1a60a8 0%,#5090c8 40%,#90c0e0 65%,#c8d8e8 80%,#d8b870 90%,#c89040 100%)}70%{background:linear-gradient(180deg,#c04018 0%,#d86028 40%,#e89840 70%,#d8c060 100%)}82%{background:linear-gradient(180deg,#100820 0%,#1a1430 50%,#0a0810 100%)}100%{background:linear-gradient(180deg,#04080e 0%,#0a1020 100%)}}
        .hero-stars{position:absolute;inset:0;pointer-events:none;animation:fadeStars 52s linear infinite}
        @keyframes fadeStars{0%,20%{opacity:1}38%,70%{opacity:0}80%,100%{opacity:1}}
        .star{--d: 2s;position:absolute;background:white;border-radius:50%;animation:twinkle var(--d,2s) ease-in-out infinite alternate}
        @keyframes twinkle{from{opacity:.05}to{opacity:.9}}
        .orbit{position:absolute;left:50%;top:58%;width:1px;height:1px;animation:orbit 52s linear infinite}
        @keyframes orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        .hero-sol{position:absolute;width:72px;height:72px;top:-330px;left:-36px;background:radial-gradient(circle,#fff5d0 0%,#ffc820 45%,#e88010 80%,transparent 100%);border-radius:50%;box-shadow:0 0 50px 18px rgba(255,180,30,.4),0 0 100px 50px rgba(255,180,30,.12);animation:counterOrbit 52s linear infinite}
        .hero-lua{position:absolute;width:52px;height:52px;bottom:-330px;left:-26px;background:radial-gradient(circle,#f8f0d8 0%,#d0c8a0 55%,transparent 85%);border-radius:50%;box-shadow:0 0 24px 6px rgba(248,240,200,.2);animation:counterOrbit 52s linear infinite}
        @keyframes counterOrbit{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
        .hero-mar{position:absolute;bottom:20%;left:0;right:0;height:190px;background:linear-gradient(180deg,#1a6888 0%,#1050a0 55%,#0a3870 100%);animation:marCiclo 52s linear infinite}
        @keyframes marCiclo{0%,22%{filter:brightness(.6) saturate(.7)}42%,60%{filter:brightness(1.15) saturate(1.2)}78%,100%{filter:brightness(.6) saturate(.7)}}
        .onda{position:absolute;top:0;left:-100%;width:300%;height:28px}
        .onda svg{width:100%;height:100%}
        .onda1{animation:ondaMove 7s linear infinite}
        .onda2{animation:ondaMove 11s linear infinite reverse;top:10px;opacity:.45}
        .onda3{animation:ondaMove 15s linear infinite;top:18px;opacity:.28}
        @keyframes ondaMove{from{transform:translateX(0)}to{transform:translateX(33.33%)}}
        .hero-areia{position:absolute;bottom:0;left:0;right:0;height:20%;background:linear-gradient(180deg,#d8a040 0%,#a87820 100%)}
        .hero-areia::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,#c89030 0 18px,#a87020 18px 28px,#d8a840 28px 46px)}
        .plat{position:absolute;height:18px;background:linear-gradient(180deg,#d8a848 0%,#b07820 100%);border-radius:2px;box-shadow:0 4px 0 #784808,0 6px 12px rgba(0,0,0,.3)}
        .plat1{bottom:calc(20% + 78px);left:5%;width:180px}
        .plat2{bottom:calc(20% + 162px);left:28%;width:158px;animation:platFlutua 3.8s ease-in-out infinite}
        .plat3{bottom:calc(20% + 122px);left:56%;width:140px;animation:platFlutua 2.9s ease-in-out infinite .9s}
        .plat4{bottom:calc(20% + 210px);right:5%;width:110px;animation:platFlutua 4.3s ease-in-out infinite .4s}
        @keyframes platFlutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
        .piggy-wrap{position:absolute;bottom:calc(20% + 96px);left:calc(5% + 48px);animation:piggyBob .7s steps(2) infinite}
        @keyframes piggyBob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
        .piggy-sprite{width:38px;height:46px;position:relative}
        .p-head{position:absolute;width:34px;height:26px;top:0;left:2px;background:#f0a880;border-radius:6px 6px 2px 2px;box-shadow:inset -4px -4px 0 #c87858}
        .p-head::before{content:'';position:absolute;width:10px;height:10px;background:#f0a880;top:-5px;left:3px;border-radius:3px;box-shadow:16px 0 0 #f0a880}
        .p-eye{position:absolute;width:5px;height:6px;background:#1a0800;top:8px;left:6px;border-radius:2px}
        .p-eye::after{content:'';position:absolute;width:2px;height:2px;background:white;top:1px;left:1px;border-radius:50%}
        .p-eye2{left:21px}
        .p-snout{position:absolute;width:14px;height:10px;background:#d87860;bottom:4px;left:10px;border-radius:4px}
        .p-snout::before,.p-snout::after{content:'';position:absolute;width:4px;height:4px;background:#a03828;border-radius:50%;top:2px}
        .p-snout::before{left:2px}.p-snout::after{right:2px}
        .p-body{position:absolute;width:30px;height:20px;bottom:0;left:4px;background:#f0a880;border-radius:0 0 3px 3px;box-shadow:inset -3px -3px 0 #c87858}
        .p-belt{position:absolute;width:30px;height:5px;bottom:12px;left:4px;background:#1a3a6b}
        .p-legs{position:absolute;width:9px;height:7px;bottom:-7px;left:7px;background:#c87858;border-radius:0 0 3px 3px;box-shadow:12px 0 0 #c87858}
        .curupira-wrap{position:absolute;bottom:calc(20% + 4px);right:16%;animation:curupiraAndada .55s steps(2) infinite}
        @keyframes curupiraAndada{from{transform:scaleX(1)}to{transform:scaleX(-1)}}
        .g-sprite{width:40px;height:54px;position:relative}
        .g-head{position:absolute;width:36px;height:28px;top:0;left:2px;background:#7a4820;border-radius:4px;box-shadow:inset -3px -4px 0 #582808}
        .g-eyes{position:absolute;width:6px;height:6px;background:#e04010;top:10px;left:6px;border-radius:1px;box-shadow:14px 0 0 #e04010}
        .g-teeth{position:absolute;width:5px;height:4px;background:white;bottom:5px;left:14px;border-radius:1px;box-shadow:7px 0 0 white}
        .g-body{position:absolute;width:36px;height:26px;bottom:0;left:2px;background:#2a6820;border-radius:2px;box-shadow:inset -3px -4px 0 #1a4810}
        .g-legs{position:absolute;bottom:-7px;left:7px;width:9px;height:7px;background:#582808;border-radius:0 0 3px 3px;box-shadow:13px 0 0 #582808}
        .moedas-arco{position:absolute;bottom:calc(20% + 270px);left:31%;display:flex;gap:7px}
        .moeda{width:16px;height:16px;background:radial-gradient(circle at 35% 35%,#ffe090,#f0c020,#c08820);border-radius:50%;box-shadow:0 0 10px rgba(240,192,32,.7);animation:moedaBob 1.3s ease-in-out infinite alternate}
        @keyframes moedaBob{from{transform:translateY(0)}to{transform:translateY(-9px)}}
        .fl-item{position:absolute;animation:itemFlutua 2.2s ease-in-out infinite alternate}
        .fl-iara{width:20px;height:20px;background:#1a8ab0;border-radius:50% 50% 8px 8px;bottom:calc(20% + 200px);right:22%;box-shadow:inset 4px 4px 0 #40b8d8,0 0 12px rgba(26,138,176,.5)}
        .fl-vela{width:12px;height:22px;background:var(--laranja);border-radius:4px 4px 2px 2px;bottom:calc(20% + 14px);left:43%;box-shadow:inset -3px -3px 0 var(--laranja-q),0 0 12px rgba(224,104,32,.5)}
        .fl-engrenagem{width:22px;height:22px;background:var(--ocre);border-radius:5px;bottom:calc(20% + 190px);right:7%;box-shadow:inset 2px 2px 0 #e0b040,0 0 12px rgba(200,144,48,.5);border:4px solid #a07018}
        @keyframes itemFlutua{from{transform:translateY(0)}to{transform:translateY(-11px)}}
        .boitatas{position:absolute;inset:0;pointer-events:none;animation:fadeStars 52s linear infinite}
        .boitata{position:absolute;width:4px;height:4px;background:#f04810;border-radius:50%;box-shadow:0 0 8px 3px rgba(240,72,16,.8);animation:boitataMove 9s ease-in-out infinite alternate}
        .b1{bottom:28%;left:11%;animation-delay:0s}.b2{bottom:38%;right:20%;animation-delay:3s}.b3{bottom:18%;left:52%;animation-delay:6s}
        @keyframes boitataMove{0%{transform:translate(0,0)}50%{transform:translate(22px,-16px)}100%{transform:translate(-14px,-28px)}}
        .hero-hud{position:absolute;top:20px;left:28px;font-family:var(--f-mono);z-index:10;display:flex;flex-direction:column;gap:6px}
        .hud-score{font-size:15px;color:#f0c020;letter-spacing:.08em;text-shadow:1px 2px 0 rgba(0,0,0,.7)}
        .hud-lives{font-size:13px;color:#e04040}
        .hud-row{display:flex;align-items:center;gap:7px}
        .hud-lbl{font-size:10px;color:#40c8e8;letter-spacing:.06em}
        .hud-bar{width:96px;height:7px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:1px;overflow:hidden}
        .hud-fill{height:100%;width:65%;background:linear-gradient(90deg,#40c8e8,#20a8c8)}
        .hero-content{position:relative;z-index:20;flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 24px}
        .hero-inner{max-width:740px}
        .hero-frame{border:2px solid rgba(255,255,255,.18);border-radius:2px;padding:40px 48px;position:relative;backdrop-filter:blur(4px);background:rgba(10,16,28,.25)}
        .hero-frame::before,.hero-frame::after{content:'◆';position:absolute;font-size:10px;color:var(--laranja);opacity:.7}
        .hero-frame::before{top:-7px;left:50%;transform:translateX(-50%)}
        .hero-frame::after{bottom:-7px;left:50%;transform:translateX(-50%)}
        .frame-corner{position:absolute;width:16px;height:16px;border-color:rgba(255,255,255,.3);border-style:solid}
        .fc-tl{top:-1px;left:-1px;border-width:2px 0 0 2px}.fc-tr{top:-1px;right:-1px;border-width:2px 2px 0 0}
        .fc-bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px}.fc-br{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
        .hero-kicker{font-family:var(--f-ui);font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:20px;display:block}
        .hero-title{font-family:var(--f-display);font-size:clamp(60px,10.5vw,130px);font-weight:900;line-height:.88;color:white;text-shadow:0 4px 40px rgba(0,0,0,.5);margin-bottom:8px;font-style:italic}
        .t-gold{color:#f0c858;font-style:normal}.t-azul{color:#78c8f0;font-style:normal}
        .cordel-line{font-family:var(--f-cordel);font-size:13px;color:rgba(255,255,255,.45);letter-spacing:.14em;margin:16px 0 28px;display:flex;align-items:center;justify-content:center;gap:14px}
        .cordel-line::before,.cordel-line::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.15);max-width:60px}
        .hero-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
        .btn-jogar{font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--tinta);background:#f0c858;text-decoration:none;padding:13px 34px;border-radius:2px;box-shadow:0 4px 20px rgba(0,0,0,.3),3px 3px 0 rgba(0,0,0,.2);transition:background .2s,transform .15s,box-shadow .15s}
        .btn-jogar:hover{background:white;transform:translateY(-2px) translateX(-1px);box-shadow:0 6px 24px rgba(0,0,0,.3),4px 4px 0 rgba(0,0,0,.15)}
        .btn-mapa{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.8);background:rgba(255,255,255,.08);text-decoration:none;padding:12px 28px;border-radius:2px;border:1px solid rgba(255,255,255,.2);transition:background .2s,border-color .2s,transform .15s}
        .btn-mapa:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4);transform:translateY(-2px)}
        .hero-meta{font-family:var(--f-mono);font-size:9px;color:rgba(255,255,255,.3);letter-spacing:.16em;display:flex;align-items:center;justify-content:center;gap:16px}
        .blink{animation:blink 1s steps(1) infinite}
        @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
        .ticker{background:var(--azul);overflow:hidden;border-top:2px solid var(--azul-claro);border-bottom:3px solid var(--laranja)}
        .ticker-track{display:inline-flex;animation:tick 40s linear infinite;white-space:nowrap}
        .ticker-item{font-family:var(--f-cordel);font-size:13px;color:rgba(244,239,230,.8);padding:10px 0;display:inline-flex;align-items:center;letter-spacing:.06em}
        .ticker-sep{padding:0 24px;color:var(--laranja);opacity:.8;font-size:16px}
        @keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
        .section{padding:108px 48px}
        .container{max-width:1160px;margin:0 auto}
        .s-label{font-family:var(--f-ui);font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px;margin-bottom:20px}
        .s-label::before{content:'◆';color:var(--laranja);font-size:8px}
        h2.s-title{font-family:var(--f-display);font-size:clamp(38px,5.5vw,68px);font-weight:900;line-height:.95;letter-spacing:-.01em;color:var(--tinta);margin-bottom:20px}
        h2.s-title em{font-style:italic;color:var(--azul-med)}
        h2.s-title .sol{color:var(--laranja)}
        .s-lead{font-family:var(--f-display);font-size:16px;font-weight:400;font-style:italic;line-height:1.85;color:var(--muted);max-width:540px;margin-bottom:52px}
        .azulejo-divider{height:8px;background:repeating-linear-gradient(90deg,var(--azul) 0 12px,var(--branco) 12px 14px,var(--laranja) 14px 26px,var(--branco) 26px 28px,var(--ocre) 28px 40px,var(--branco) 40px 42px,var(--azul) 42px 54px,var(--branco) 54px 56px);opacity:.7}
        .reveal{opacity:0;transform:translateY(26px);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}
        .reveal.in{opacity:1;transform:none}
        .d1{transition-delay:.07s}.d2{transition-delay:.14s}.d3{transition-delay:.21s}
        .sobre-section{background:var(--creme);border-top:1px solid var(--borda)}
        .sobre-layout{display:grid;grid-template-columns:1fr 340px;gap:72px;align-items:start}
        .sobre-prose{font-size:16px;line-height:1.95;color:rgba(14,21,32,.68)}
        .sobre-prose p+p{margin-top:1.5em}
        .azulejo-panel{background:var(--azul);border-radius:2px;padding:32px;position:relative;overflow:hidden}
        .azulejo-panel::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 32px),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 32px),repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 1px,transparent 1px 22px),repeating-linear-gradient(-45deg,rgba(255,255,255,.03) 0 1px,transparent 1px 22px)}
        .ap-stat{padding:20px 0;border-bottom:1px solid rgba(255,255,255,.1);position:relative;z-index:1}
        .ap-stat:first-child{padding-top:0}.ap-stat:last-child{border-bottom:none;padding-bottom:0}
        .ap-num{font-family:var(--f-display);font-size:48px;color:#f0c858;line-height:1;font-style:italic}
        .ap-lbl{font-family:var(--f-ui);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,239,230,.5);margin-top:4px}
        .folclore-section{background:var(--azul);border-top:1px solid rgba(255,255,255,.08)}
        .folclore-section h2.s-title{color:var(--branco)}
        .folclore-section h2.s-title em{color:#f0c858}
        .folclore-section .s-label{color:rgba(244,239,230,.4)}
        .folclore-section .s-label::before{color:var(--laranja)}
        .folclore-section .s-lead{color:rgba(244,239,230,.5)}

<body>
<div id="root"></div>
<script type="text/babel">
    const {useState,useEffect,useRef}=React;

    const Navbar=()=>(
        <nav>
            <a href="#" className="nav-logo"><div className="nav-losango"/>Piggy Beach</a>
            <ul className="nav-links">
                <li><a href="#sobre">O Jogo</a></li>
                <li><a href="#folclore">Folclore</a></li>
                <li><a href="#screenshots">Gameplay</a></li>
                <li><a href="#equipe">Equipe</a></li>
            </ul>
            <a href="#cta" className="nav-cta">Jogar</a>
        </nav>
    );

    const Hero=()=>{
        const [score,setScore]=useState(24860);
        const starsRef=useRef(null);
        useEffect(()=>{
            if(starsRef.current&&!starsRef.current.childNodes.length){
                for(let i=0;i<110;i++){
                    const s=document.createElement('div');
                    s.className='star';
                    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*65}%;width:${Math.random()<.1?3:2}px;height:${Math.random()<.1?3:2}px;--d:${(Math.random()*2.5+1.5).toFixed(1)}s;animation-delay:${(Math.random()*5).toFixed(1)}s`;
                    starsRef.current.appendChild(s);
                }
            }
            const iv=setInterval(()=>setScore(p=>p+10),2200);
            return()=>clearInterval(iv);
        },[]);
        return(
            <header className="hero">
                <div className="hero-sky"/>
                <div className="hero-stars" ref={starsRef}/>
                <div className="orbit"><div className="hero-sol"/><div className="hero-lua"/></div>
                <div className="hero-mar">
                    <div className="onda onda1"><svg viewBox="0 0 1200 30" preserveAspectRatio="none"><path d="M0,15 C200,0 400,30 600,15 C800,0 1000,30 1200,15 L1200,30 L0,30 Z" fill="rgba(255,255,255,0.08)"/></svg></div>
                    <div className="onda onda2"><svg viewBox="0 0 1200 30" preserveAspectRatio="none"><path d="M0,15 C150,30 350,0 600,15 C850,30 1050,0 1200,15 L1200,30 L0,30 Z" fill="rgba(255,255,255,0.06)"/></svg></div>
                    <div className="onda onda3"><svg viewBox="0 0 1200 30" preserveAspectRatio="none"><path d="M0,15 C100,25 300,5 600,15 C900,25 1100,5 1200,15 L1200,30 L0,30 Z" fill="rgba(255,255,255,0.04)"/></svg></div>
                </div>
                <div className="hero-areia"/>
                {['plat1','plat2','plat3','plat4'].map(c=><div key={c} className={`plat ${c}`}/>)}
                <div className="boitatas">{['b1','b2','b3'].map(c=><div key={c} className={`boitata ${c}`}/>)}</div>
                <div className="moedas-arco">
                    {[0,.15,.3,.45,.6].map((d,i)=><div key={i} className="moeda" style={{animationDelay:`${d}s`,marginTop:i%2?'-9px':'0'}}/>)}
                </div>
                <div className="fl-item fl-iara"/><div className="fl-item fl-vela"/><div className="fl-item fl-engrenagem"/>

            els.forEach(el=>io.observe(el));
